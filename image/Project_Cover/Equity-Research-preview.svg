<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">End-to-end multi-agent equity research</title>
  <desc id="description">The local research workflow: Chief of Staff scopes a question, source discovery collects evidence, the fundamental researcher analyzes it, application code calculates and validates valuation, the CIO reviews the decision, and shared memory retains the research trail. The public Meta case is a static sourced illustration, not a live agent run.</desc>
  <rect width="1200" height="800" fill="#172822"/>
  <path d="M64 83H1136" stroke="#536657"/>
