    <text x="1136" y="58" text-anchor="end" font-size="22">EQUITY RESEARCH</text>
  </g>
  <text x="64" y="179" font-family="Georgia,serif" font-size="65" fill="#f3f1e8">Research, from start to finish.</text>
  <text x="64" y="233" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#c7d0bd">Agents reason. Code checks. Sources stay linked.</text>
